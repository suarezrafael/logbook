name: NC0_k-Avoid verification

on:
  push:
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  pull_request:
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Quick verification
        working-directory: research/p-vs-np
        run: |
          set -o pipefail
          bash ./verify_all.sh | tee verify-quick.log
      - name: Upload quick transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-quick-${{ github.run_id }}
          path: research/p-vs-np/verify-quick.log
          if-no-files-found: error
          retention-days: 30

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Full verification
        working-directory: research/p-vs-np
        run: |
          set -o pipefail
          bash ./verify_all.sh --full | tee verify-full.log
      - name: Upload full transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-full-${{ github.run_id }}
          path: research/p-vs-np/verify-full.log
          if-no-files-found: error
          retention-days: 30

  latex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install minimal TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Compile formal modules
        run: |
          set -euo pipefail
          mkdir -p latex-build/v64 latex-build/v65 latex-build/v68 latex-build/v69 latex-build/v70 latex-build/v71-theorem latex-build/v71-manuscript latex-build/v72 latex-build/v73 latex-build/v74 latex-build/v75 latex-build/v76 latex-build/v77
          for pass in 1 2; do
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v64" research/p-vs-np/v64/V57_BLOCK_IRREDUNDANCY_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v65" research/p-vs-np/v65/V56_AFFINE_FIBER_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v68" research/p-vs-np/v68/V68_SPINE_TREE_DAG_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v69" research/p-vs-np/v69/V69_ORDER_ROBUSTNESS_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v70" research/p-vs-np/v70/V70_SUPPORT_FRONTIER_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v71-theorem" research/p-vs-np/v71/V71_WIDTH_CORRESPONDENCE_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v71-manuscript" research/p-vs-np/v71/MANUSCRIPT.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v72" research/p-vs-np/v72/V72_BRANCH_RESIDUAL_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v73" research/p-vs-np/v73/V73_BICRITERIA_AVOIDANCE_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v74" research/p-vs-np/v74/V74_TWO_FIBER_AVOIDANCE_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v75" research/p-vs-np/v75/V75_SYMBOLIC_PREFIX_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v76" research/p-vs-np/v76/V76_TOP_TREE_TRANSFER_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v77" research/p-vs-np/v77/V77_TOPOLOGY_TREE_TRANSFER_THEOREM.tex
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory="$GITHUB_WORKSPACE/latex-build/v77" research/p-vs-np/v77/V77_FPT_SUPPORT_WIDTH_THEOREM.tex
          done
      - name: Upload LaTeX artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-latex-${{ github.run_id }}
          path: |
            latex-build/**/*.pdf
            latex-build/**/*.log
          if-no-files-found: error
          retention-days: 30
