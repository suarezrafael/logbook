name: NC0_k-Avoid verification

on:
  push:
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  pull_request:
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Quick verification
        working-directory: research/p-vs-np
        run: bash ./verify_all.sh

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Full verification
        working-directory: research/p-vs-np
        run: bash ./verify_all.sh --full
