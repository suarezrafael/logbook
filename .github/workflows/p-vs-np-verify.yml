name: NC0_k-Avoid verification

on:
  push:
    branches:
      - main
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/p-vs-np/**'
      - '.github/workflows/p-vs-np-verify.yml'
  schedule:
    - cron: '17 06 * * 1'
  workflow_dispatch:

concurrency:
  group: p-vs-np-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Historical verifier compatibility index. The executable source of truth is
# LATEX_MODULES.tsv; these names remain here so older repository-surface audits
# can confirm that their formal modules are still part of the CI contract.
# V57_BLOCK_IRREDUNDANCY_THEOREM.tex
# V56_AFFINE_FIBER_THEOREM.tex
# V68_SPINE_TREE_DAG_THEOREM.tex
# V69_ORDER_ROBUSTNESS_THEOREM.tex
# V70_SUPPORT_FRONTIER_THEOREM.tex
# V71_WIDTH_CORRESPONDENCE_THEOREM.tex
# MANUSCRIPT.tex
# V72_BRANCH_RESIDUAL_THEOREM.tex
# V73_BICRITERIA_AVOIDANCE_THEOREM.tex
# V74_TWO_FIBER_AVOIDANCE_THEOREM.tex
# V75_SYMBOLIC_PREFIX_THEOREM.tex
# V76_TOP_TREE_TRANSFER_THEOREM.tex
# V77_TOPOLOGY_TREE_TRANSFER_THEOREM.tex
# V77_FPT_SUPPORT_WIDTH_THEOREM.tex

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      latex: ${{ steps.detect.outputs.latex }}
      compatibility: ${{ steps.detect.outputs.compatibility }}
      full_replay: ${{ steps.detect.outputs.full_replay }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect expensive verification needs
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          latex=false
          compatibility=false
          full_replay=false
          files=""

          case "$EVENT_NAME" in
            workflow_dispatch)
              latex=true
              full_replay=true
              ;;
            schedule)
              ;;
            pull_request)
              files="$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")"
              ;;
            push)
              base="$BEFORE_SHA"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-parents=0 "$PUSH_HEAD_SHA")"
              fi
              files="$(git diff --name-only "$base" "$PUSH_HEAD_SHA")"
              ;;
          esac

          if printf '%s\n' "$files" | grep -Eq \
            '(^research/p-vs-np/.*\.tex$|^research/p-vs-np/LATEX_MODULES\.tsv$|^research/p-vs-np/check_latex_manifest\.py$|^\.github/workflows/p-vs-np-verify\.yml$)'; then
            latex=true
          fi

          if printf '%s\n' "$files" | grep -Fxq \
            'research/p-vs-np/LAB_STATUS.json'; then
            compatibility=true
          fi

          if printf '%s\n' "$files" | grep -Eq \
            '(^\.github/workflows/p-vs-np-verify\.yml$|^research/p-vs-np/verify_all\.sh$|^research/p-vs-np/run_verification_in_sandbox\.sh$|^research/p-vs-np/assert_clean_tree\.sh$|^research/p-vs-np/check_(runner_coverage|latex_manifest|ci_contract)\.py$|^research/p-vs-np/v56/verify_index\.py$|^research/p-vs-np/v58/verify_exact\.py$|^research/p-vs-np/v70/verify_search_reproduction\.py$)'; then
            full_replay=true
          fi

          echo "latex=$latex" >> "$GITHUB_OUTPUT"
          echo "compatibility=$compatibility" >> "$GITHUB_OUTPUT"
          echo "full_replay=$full_replay" >> "$GITHUB_OUTPUT"
          printf 'latex=%s compatibility=%s full_replay=%s\n' \
            "$latex" "$compatibility" "$full_replay"
          printf '%s\n' "$files"

  quick:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Focused quick verification
        working-directory: research/p-vs-np
        run: |
          set -o pipefail
          bash ./run_verification_in_sandbox.sh 2>&1 | tee "${RUNNER_TEMP}/verify-quick.log"
      - name: Assert quick verification is read-only
        if: always()
        working-directory: research/p-vs-np
        run: bash ./assert_clean_tree.sh
      - name: Upload quick transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-quick-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-quick.log
          if-no-files-found: error
          retention-days: 14

  compatibility:
    needs: changes
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'push' &&
       needs.changes.outputs.compatibility == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Historical compatibility verification
        working-directory: research/p-vs-np
        run: |
          set -o pipefail
          bash ./run_verification_in_sandbox.sh --compat 2>&1 | tee "${RUNNER_TEMP}/verify-compatibility.log"
      - name: Assert compatibility verification is read-only
        if: always()
        working-directory: research/p-vs-np
        run: bash ./assert_clean_tree.sh
      - name: Upload compatibility transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-compatibility.log
          if-no-files-found: error
          retention-days: 14

  full:
    needs: changes
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       needs.changes.outputs.full_replay == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Cumulative exact replay verification
        working-directory: research/p-vs-np
        run: |
          set -o pipefail
          bash ./run_verification_in_sandbox.sh --full 2>&1 | tee "${RUNNER_TEMP}/verify-full.log"
      - name: Assert full verification is read-only
        if: always()
        working-directory: research/p-vs-np
        run: bash ./assert_clean_tree.sh
      - name: Upload full transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-full-${{ github.run_id }}
          path: ${{ runner.temp }}/verify-full.log
          if-no-files-found: error
          retention-days: 30

  latex:
    needs: changes
    if: needs.changes.outputs.latex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install minimal TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Validate LaTeX manifest
        working-directory: research/p-vs-np
        run: python3 ./check_latex_manifest.py
      - name: Compile formal modules
        working-directory: research/p-vs-np
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r output_key module; do
            [[ -z "$output_key" || "$output_key" == \#* ]] && continue
            output_directory="${RUNNER_TEMP}/latex-build/$output_key"
            mkdir -p "$output_directory"
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error \
                -output-directory="$output_directory" "$module"
            done
          done < LATEX_MODULES.tsv
      - name: Assert LaTeX build is read-only
        if: always()
        working-directory: research/p-vs-np
        run: bash ./assert_clean_tree.sh
      - name: Upload LaTeX artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p-vs-np-latex-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/latex-build/**/*.pdf
            ${{ runner.temp }}/latex-build/**/*.log
          if-no-files-found: error
          retention-days: 30
